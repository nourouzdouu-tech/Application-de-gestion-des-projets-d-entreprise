<div class="admin-layout">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">

    <div class="sidebar-top">
      <!-- Logo -->
      <div class="sidebar-logo">
        <img src="/assets/DXC_logo.png" alt="DXC Technology" class="dxc-logo-img" />
        <span class="logo-role">ADMIN</span>
      </div>

      <!-- Navigation -->
      <nav class="sidebar-nav">
        <p class="nav-section-label">Navigation</p>

        <a
          class="nav-item"
          routerLink="/admin/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          <span>Tableau de bord</span>
        </a>

        <a
          class="nav-item"
          routerLink="/admin/utilisateurs"
          routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span>Gestion des Utilisateurs</span>
        </a>

        <a
          class="nav-item"
          routerLink="/admin/roles"
          routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <span>Gestion des Rôles</span>
        </a>

        <a
          class="nav-item"
          routerLink="/admin/clients"
          routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span>Gestion des Clients</span>
        </a>
                <a
        class="nav-item"
        routerLink="/admin/profile"
        routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
        </svg>
        <span>Gestion des Profils</span>
        </a>
      </nav>
    </div>

    <!-- Profil -->
    <div class="sidebar-profile">
      <div class="profile-avatar">{{ getInitials() }}</div>

      <div class="profile-info">
        <span class="profile-name">
          {{ currentUser()?.prenom }} {{ currentUser()?.nom }}
        </span>
        <span class="profile-email">
          {{ currentUser()?.email }}
        </span>
      </div>

      <button type="button" class="logout-btn" (click)="logout()" title="Déconnexion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>

  </aside>

  <!-- ===== CONTENU ===== -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
