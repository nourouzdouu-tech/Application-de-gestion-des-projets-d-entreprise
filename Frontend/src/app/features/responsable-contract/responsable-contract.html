<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">
        <img src="/assets/DXC_logo.png" alt="DXC Technology" class="dxc-logo-img">
        <div class="logo-role">RESPONSABLE DE CONTRAT</div>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-section-label">Navigation</p>

        <a class="nav-item" routerLink="/responsable-contrat/dashboard" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          Tableau de bord
        </a>

        

        <a class="nav-item" routerLink="/responsable-contrat/projets" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7a2 2 0 0 1 2-2h3l2 2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
          </svg>
          Projets
        </a>

        <a class="nav-item" routerLink="/responsable-contrat/facturation" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="2" />
            <line x1="8" y1="6" x2="16" y2="6" />
            <line x1="8" y1="10" x2="10" y2="10" />
            <line x1="14" y1="10" x2="16" y2="10" />
            <line x1="8" y1="14" x2="10" y2="14" />
            <line x1="14" y1="14" x2="16" y2="14" />
            <line x1="8" y1="18" x2="16" y2="18" />
          </svg>
          Facturation
        </a>

        

        
      </nav>
    </div>

    <div class="sidebar-profile">
      <div class="profile-avatar">{{ getInitials() }}</div>
      <div class="profile-info">
        <span class="profile-name">{{ currentUser()?.prenom }} {{ currentUser()?.nom }}</span>
        <span class="profile-email">{{ currentUser()?.email }}</span>
      </div>
      <button class="logout-btn" title="Déconnexion" type="button" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
