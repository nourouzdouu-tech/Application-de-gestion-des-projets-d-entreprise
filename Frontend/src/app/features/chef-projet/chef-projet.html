<div class="admin-layout">
  <!-- ===== SIDEBAR COMMUN ===== -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">
        <img src="/assets/DXC_logo.png" alt="DXC Technology" class="dxc-logo-img">
        <div class="logo-role">CHEF DE PROJET</div>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-section-label">Navigation</p>

        <a class="nav-item" routerLink="/chef-projet/dashboard" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          Tableau de bord
        </a>

        <a class="nav-item" routerLink="/chef-projet/projets" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7a2 2 0 0 1 2-2h3l2 2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
          </svg>
          Mes Projets
        </a>


        <a class="nav-item" routerLink="/chef-projet/taches" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4l2 2h9a2 2 0 0 1 2 2z" />
          </svg>
          Mes Tâches
          </a>

        

        <a class="nav-item" routerLink="/chef-projet/equipes" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Gestion d'Équipe
        </a>

       <a class="nav-item" routerLink="/chef-projet/calendrier" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          Calendrier
        </a>

        <a class="nav-item" routerLink="/chef-projet/reporting" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="20" x2="12" y2="10" />
            <line x1="18" y1="20" x2="18" y2="4" />
            <line x1="6" y1="20" x2="6" y2="16" />
          </svg>
          Reporting
        </a>

        <a class="nav-item nav-item-with-badge" routerLink="/chef-projet/messages" routerLinkActive="active">
          <div class="nav-item-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            <span>Messages</span>
          </div>
          <span class="nav-badge">3</span>
        </a>

        <a class="nav-item" routerLink="/chef-projet/audit" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
          Audit
        </a>
      </nav>
    </div>

    <div class="sidebar-profile">
  <div class="profile-avatar">{{ getInitials() }}</div>
  <div class="profile-info">
    <span class="profile-name">{{ currentUser()?.prenom }} {{ currentUser()?.nom }}</span>
    <span class="profile-email">{{ currentUser()?.email }}</span>
  </div>
  <button class="logout-btn" title="Déconnexion" type="button" (click)="logout()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" y1="12" x2="9" y2="12" />
    </svg>
  </button>
</div>
  </aside>

  <!-- ===== CONTENU DES PAGES ===== -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
