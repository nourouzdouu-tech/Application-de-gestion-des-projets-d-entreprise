name: Backend CI Workflow

run-name: Fati Backend

on:
  push:
    branches:
      - fati
    paths:
      - Backend/**
  pull_request:
    branches:
      - fati
    paths:
      - Backend/**

jobs:
  building-testing-project:
    name: Building Spring Boot Project
    runs-on: ubuntu-latest
    steps:

      - name: Get latest code
        uses: actions/checkout@v2.3.2

      - name: List files in the current directory
        run: ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Build and Test Spring Boot Project
        run: ./mvnw clean install 
        working-directory: ./Backend

      - name: Run Security Audit for Spring Boot Project
        run: ./mvnw dependency-check:check || true
        working-directory: ./Backend

      - name: Build Spring Boot Project
        run: ./mvnw package -DskipTests
        working-directory: ./Backend

      - name: List files in the Backend target directory
        run: ls -la ./Backend/target
          