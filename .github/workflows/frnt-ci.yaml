name: Harmony CI Workflow

run-name: Fati Harmony

on:
  push:
    branches:
      - fati

jobs:
  building-testing-project:
    name: Building Angular Project
    runs-on: ubuntu-latest
    steps:

      - name: Get latest code
        uses: actions/checkout@v2.3.2

      - name: List files in the current directory
        run: ls -la

      - name: Use Node.js 20
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      
      - name: Verify Node.js and npm versions
        run: |
          node -v
          npm -v

      - name: Install Dependencies for Angular Project
        run: npm install
        working-directory: ./Frontend

      - name: Run Tests for Angular Project
        run: npm test || true
        working-directory: ./Frontend

      - name: Lint Angular Project
        run: npm run lint || true
        working-directory: ./Frontend

      - name: Run E2E Tests for Angular Project
        run: npm run e2e || true
        working-directory: ./Frontend

      - name: Run Security Audit for Angular Project
        run: npm audit || true
        working-directory: ./Frontend

      - name: Build Angular Project
        run: npm run build --prod
        working-directory: ./Frontend

  docker-build-and-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: building-testing-project
    steps:

      - name: Get latest code
        uses: actions/checkout@v2.3.2
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/fati-harmony:latest .
        working-directory: ./Frontend

      - name: List Docker Images
        run: docker images
          
