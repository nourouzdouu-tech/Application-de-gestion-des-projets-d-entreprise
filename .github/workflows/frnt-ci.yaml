name: Harmony CI Workflow

run-name: Fati Harmony

on:
  push:
    branches:
      - fati

jobs:
  building:
    name: Building Angular Project
    runs-on: ubuntu-latest
    steps:

      - name: Get latest code
        uses: actions/checkout@v2.3.2

      - name: List files in the current directory
        run: ls -la

      - name: Use Node.js 20
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      
      - name: Verify Node.js and npm versions
        run: |
          node -v
          npm -v

      - name: Install Dependencies for Angular Project
        run: npm install
        working-directory: ./Frontend

      - name: Run Tests for Angular Project
        run: npm test || true
        working-directory: ./Frontend

      - name: Lint Angular Project
        run: npm run lint || true
        working-directory: ./Frontend

      - name: Run E2E Tests for Angular Project
        run: npm run e2e || true
        working-directory: ./Frontend

      - name: Run Security Audit for Angular Project
        run: npm audit || true
        working-directory: ./Frontend

      - name: Build Angular Project
        run: npm run build --prod
        working-directory: ./Frontend



