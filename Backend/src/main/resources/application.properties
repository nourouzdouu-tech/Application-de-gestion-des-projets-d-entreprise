spring.application.name=dxc-platform

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestion_projet}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespostgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
jwt.secret=${JWT_SECRET:TXlDbGVTZWNyZXRNYUNsZVNlY3JldE1hQ2xlU2VjcmV0MTIzNDU=}
logging.level.com.dxc.dxc_platform=DEBUG
logging.level.org.springframework.security=DEBUG

file.upload-dir=${FILE_UPLOAD_DIR:${user.home}/Desktop/uploads/}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Configuration SMTP GMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

logging.level.com.dxc.dxc_platform.security=DEBUG

nvidia.api.key=${NVIDIA_API_KEY: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}