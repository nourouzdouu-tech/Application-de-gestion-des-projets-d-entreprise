version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: harmony_db
    environment:
      POSTGRES_USER: harmony_user
      POSTGRES_PASSWORD: harmony_password
      POSTGRES_DB: harmony_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmony_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: harmonyback:v1
    container_name: harmony_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/harmony_db
      SPRING_DATASOURCE_USERNAME: harmony_user
      SPRING_DATASOURCE_PASSWORD: harmony_password
    ports:
      - "8080:8080"

volumes:
  postgres_data:
